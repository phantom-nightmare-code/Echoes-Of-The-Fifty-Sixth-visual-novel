name: Deploy installable web app

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "assets/backgrounds/**"
      - "assets/characters/**"
      - "pwa/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare PWA bundle
        run: |
          python -m pip install "Pillow>=10,<12"
          python pwa/export_story.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

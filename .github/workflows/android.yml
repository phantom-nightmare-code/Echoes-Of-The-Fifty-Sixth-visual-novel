name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180 # Increased timeout to prevent random cancellations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev aidl

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          # Pinned Cython version to prevent hostpython3 crashes
          pip install buildozer cython==0.29.36

      - name: Verify Memory and Environment
        run: |
          free -m
          df -h

      - name: Build with Buildozer
        run: |
          # This allows the build to use unlimited memory and stack size
          ulimit -c unlimited
          ulimit -s unlimited
          
          # Run buildozer and automatically accept SDK licenses
          yes | buildozer android debug
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk

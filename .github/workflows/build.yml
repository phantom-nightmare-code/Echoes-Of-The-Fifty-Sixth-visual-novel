name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # --- NEW STEP: Download p4a locally ---
    - name: Clone python-for-android (develop branch)
      run: |
        git clone https://github.com/kivy/python-for-android.git --branch develop --single-branch p4a
        # Fix the liblzma version in the local clone
        sed -i 's/version = .*/version = 5.4.4/' p4a/pythonforandroid/recipes/liblzma/__init__.py

    - name: Clear Broken Buildozer Cache
      run: |
        rm -rf ~/.buildozer

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-global-

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches
        key: gradle-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          gradle-

    # --- MODIFIED STEP: Tell buildozer to use the local p4a ---
    - name: Build with Buildozer (Stable Docker Image)
      run: |
        docker run --rm \
          -v "${{ github.workspace }}":/home/user/hostcwd \
          -v "$HOME/.buildozer":/home/user/.buildozer \
          kivy/buildozer:1.5.0 \
          /bin/bash -c "buildozer android debug --p4a-dir=/home/user/hostcwd/p4a"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: bin/*.apk

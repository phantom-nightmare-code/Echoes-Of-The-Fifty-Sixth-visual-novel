name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Clear the broken cache that contains Python 3.14 files
    - name: Clear Broken Buildozer Cache
      run: |
        rm -rf ~/.buildozer

    # 2. Cache the Android SDK and NDK for future fast builds
    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-global-

    # 3. Cache Gradle dependencies
    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches
        key: gradle-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          gradle-

    # 4. Build using the official Docker image (changed from 1.5.0 to latest)
    - name: Build with Buildozer (Official Docker Image)
      run: |
        docker run --rm \
          -v "${{ github.workspace }}":/home/user/hostcwd \
          -v "$HOME/.buildozer":/home/user/.buildozer \
          kivy/buildozer:latest \
          android debug

    # 5. Upload the finished APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: bin/*.apk

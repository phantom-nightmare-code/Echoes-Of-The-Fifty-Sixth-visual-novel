name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Clear the Buildozer cache to remove corrupted downloads
    - name: Clear Buildozer Cache
      run: |
        rm -rf ~/.buildozer

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-global-

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches
        key: gradle-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          gradle-

    - name: Build with Buildozer (Official Docker Image)
      run: |
        docker run --rm \
          -v "${{ github.workspace }}":/home/user/hostcwd \
          -v "$HOME/.buildozer":/home/user/.buildozer \
          kivy/buildozer:1.5.0 \
          android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: bin/*.apk

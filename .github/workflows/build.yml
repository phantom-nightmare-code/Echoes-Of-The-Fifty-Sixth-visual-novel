name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # This step runs Buildozer inside the official kivy/buildozer Docker image.
    # This bypasses the broken 'Docker build' step from the previous action.
    - name: Build with Buildozer (via Official Docker Image)
      run: |
        docker run --rm \
          -v "${{ github.workspace }}":/home/user/hostcwd \
          kivy/buildozer:latest \
          buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: bin/*.apk
